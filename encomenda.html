<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Encomenda - Maison Douce</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body>

<header>

    <div class="logo">
        Maison Douce
    </div>

    <nav>
        <a href="index.html">Início</a>
        <a href="patisserie.html">Pâtisserie</a>
        <a href="boulangerie.html">Boulangerie</a>
        <a href="sobre.html">Sobre Nós</a>
    </nav>

</header>

<main class="container">
    <h1>Faça sua encomenda</h1>
    <p class="texto-encomenda">Escolha seus produtos favoritos da Maison Douce e preencha os dados para fazer sua encomenda.</p>

    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required>
        <label for="categoria">Categoria:</label>
        <select id="categoria" name="categoria" required>
            <option value="">Selecione</option>
            <option value="patisserie">Pâtisserie</option>
            <option value="boulangerie">Boulangerie</option>
        </select>
        <label for="produto">Produto:</label>
        <select id="produto" name="produto" required>
            <option value="">Selecione um produto</option>

            <optgroup label="Pâtisserie">
                <option>Macarons</option>
                <option>Éclairs</option>
                <option>Tartelette</option>
                <option>Petit Gâteau</option>
                <option>Mille-Feuille</option>
                <option>Gâteau au Chocolat</option>
            </optgroup>

            <optgroup label="Boulangerie">
                <option>Croissant</option>
                <option>Baguette Tradition</option>
                <option>Pain au Chocolat</option>
                <option>Pain aux Raisins</option>
                <option>Ficelle</option>
                <option>Brioche</option>
            </optgroup>
        </select>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" name="quantidade" min="1" required>
        <label for="data">Data:</label>
        <input type="date" id="data" name="data" required>
        <label for="pagamento">Pagamento:</label>
        <select id="pagamento" name="pagamento">
            <option value="">Selecione</option>
            <option>Pix</option>
            <option>Cartão</option>
            <option>Dinheiro</option>
        </select>
        <label for="observacao">Observações:</label>
        <textarea id="observacao" name="observacao"></textarea>
        <button type="submit">Enviar encomenda</button>
    </form>
</main>

<footer>
    <div class="footer-logo">
        MAISON DOUCE
    </div>
    <div class="footer-sub">
        Pâtisserie • Boulangerie • Paris
    </div>
</footer>
</body>
</html>
